<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEJA FORN - Verificação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-color: #0a0a1a;
            background-image: url('/fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Overlay escuro para legibilidade */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 26, 0.92) 0%, 
                rgba(30, 10, 50, 0.88) 50%, 
                rgba(10, 10, 26, 0.92) 100%);
            z-index: 0;
        }

        /* Partículas animadas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #a855f7;
            border-radius: 50%;
            box-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
            animation: float 15s infinite ease-in-out;
            opacity: 0.5;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .modal {
            background: linear-gradient(145deg, 
                rgba(20, 15, 45, 0.96), 
                rgba(10, 8, 28, 0.98));
            border: 2px solid #a855f7;
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 
                0 0 40px rgba(168, 85, 247, 0.4),
                0 0 80px rgba(168, 85, 247, 0.15),
                inset 0 0 30px rgba(168, 85, 247, 0.05);
            backdrop-filter: blur(12px);
            animation: modalAppear 0.5s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
            50% { box-shadow: 0 0 50px rgba(168, 85, 247, 0.9), 0 0 70px rgba(168, 85, 247, 0.4); }
        }

        .logo h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            margin-bottom: 5px;
        }

        .logo p {
            color: #c084fc;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .user-info {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: none;
        }

        .user-info.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .username {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }

        .username span {
            color: #a855f7;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-msg.show { display: block; }

        .success-check {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .success-check.show {
            display: block;
            animation: successPop 0.5s ease;
        }

        @keyframes successPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .success-check svg { width: 80px; height: 80px; }

        .success-check svg path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.6s ease forwards 0.2s;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .progress-container { margin-bottom: 25px; }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: rgba(168, 85, 247, 0.12);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #a855f7);
            background-size: 300% 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
            animation: shimmer 2s infinite linear;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .progress-percent {
            color: #a855f7;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-top: 12px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .steps { margin-top: 20px; }

        .step {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(168, 85, 247, 0.04);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .step.active {
            background: rgba(168, 85, 247, 0.12);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
        }

        .step.completed {
            background: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.25);
        }

        .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .step.active .step-icon {
            background: #a855f7;
            animation: spin 1s linear infinite;
        }

        .step.completed .step-icon {
            background: #22c55e;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .step-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .step.active .step-text { color: #fff; }
        .step.completed .step-text { color: #22c55e; }

        .return-btn {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
            display: none;
            text-transform: uppercase;
        }

        .return-btn.show {
            display: block;
            animation: btnAppear 0.5s ease;
        }

        @keyframes btnAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .return-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
        }

        .return-btn:active { transform: translateY(0); }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .footer span { color: #a855f7; }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="modal">
            <div class="logo">
                <div class="logo-icon">🪐</div>
                <h1>DEJA FORN</h1>
                <p>Sistema de Verificação</p>
            </div>

            <div class="error-msg" id="errorMsg">
                ❌ Ocorreu um erro durante a verificação. Tente novamente.
            </div>

            <div class="user-info" id="userInfo">
                <div class="username">Verificando: <span id="usernameDisplay">Usuário</span></div>
            </div>

            <div class="success-check" id="successCheck">
                <svg viewBox="0 0 80 80" fill="none">
                    <circle cx="40" cy="40" r="35" stroke="#22c55e" stroke-width="4"/>
                    <path d="M25 40 L35 50 L55 30" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-percent" id="progressPercent">0%</div>
                <div class="progress-text" id="progressText">Iniciando verificação...</div>
            </div>

            <div class="steps" id="stepsContainer">
                <div class="step" id="step1">
                    <div class="step-icon">⏳</div>
                    <div class="step-text">Carregando</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-icon">🔍</div>
                    <div class="step-text">Buscando</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon">🔐</div>
                    <div class="step-text">Verificando</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon">✅</div>
                    <div class="step-text">Verificado</div>
                </div>
            </div>

            <button class="return-btn" id="returnBtn" onclick="voltarDiscord()">
                ← Voltar para o Discord
            </button>

            <div class="footer">
                © 2024 <span>DEJA FORN</span> - Todos os direitos reservados
            </div>
        </div>
    </div>

    <script>
        // Cria partículas
        function criarParticulas() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        }
        criarParticulas();

        // Parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const username = urlParams.get('username');
        const error = urlParams.get('error');

        // Elementos DOM
        const el = {
            fill: document.getElementById('progressFill'),
            percent: document.getElementById('progressPercent'),
            text: document.getElementById('progressText'),
            btn: document.getElementById('returnBtn'),
            userInfo: document.getElementById('userInfo'),
            userDisplay: document.getElementById('usernameDisplay'),
            error: document.getElementById('errorMsg'),
            success: document.getElementById('successCheck'),
            progress: document.getElementById('progressContainer'),
            steps: document.getElementById('stepsContainer')
        };

        // Etapas da verificação
        const etapas = [
            { id: 'step1', texto: 'Carregando', duracao: 1500, inicio: 0, fim: 25 },
            { id: 'step2', texto: 'Buscando', duracao: 2000, inicio: 25, fim: 55 },
            { id: 'step3', texto: 'Verificando', duracao: 2500, inicio: 55, fim: 90 },
            { id: 'step4', texto: 'Verificado', duracao: 1000, inicio: 90, fim: 100 }
        ];

        function setProgress(p) {
            el.fill.style.width = p + '%';
            el.percent.textContent = Math.round(p) + '%';
        }

        function setActive(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setCompleted(id) {
            const step = document.getElementById(id);
            step.classList.remove('active');
            step.classList.add('completed');
            step.querySelector('.step-icon').textContent = '✓';
        }

        async function iniciarVerificacao() {
            if (error) {
                const msgs = {
                    'no_code': 'Código de autorização não encontrado. Tente novamente.',
                    'oauth_failed': 'Falha na autenticação com o Discord. Tente novamente.'
                };
                el.error.textContent = '❌ ' + (msgs[error] || 'Erro desconhecido. Tente novamente.');
                el.error.classList.add('show');
                el.btn.classList.add('show');
                el.progress.style.display = 'none';
                el.steps.style.display = 'none';
                return;
            }

            if (!userId) {
                el.error.textContent = '❌ Usuário não identificado. Inicie a verificação através do bot no Discord.';
                el.error.classList.add('show');
                el.btn.classList.add('show');
                el.progress.style.display = 'none';
                el.steps.style.display = 'none';
                return;
            }

            // Mostra nome do usuário
            if (username) {
                el.userDisplay.textContent = decodeURIComponent(username);
                el.userInfo.classList.add('show');
            }

            // Executa cada etapa
            for (let i = 0; i < etapas.length; i++) {
                const etapa = etapas[i];
                setActive(etapa.id);
                el.text.textContent = etapa.texto + '...';

                const passos = 30;
                const intervalo = etapa.duracao / passos;
                const inc = (etapa.fim - etapa.inicio) / passos;

                for (let p = etapa.inicio; p <= etapa.fim; p += inc) {
                    setProgress(p);
                    await new Promise(r => setTimeout(r, intervalo));
                }

                setCompleted(etapa.id);
            }

            setProgress(100);
            el.text.textContent = 'Verificação concluída!';

            // Chama API para dar cargo
            try {
                await fetch('/api/complete-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
            } catch (e) {
                console.log('Erro API:', e);
            }

            // Mostra sucesso
            setTimeout(() => {
                el.progress.style.display = 'none';
                el.steps.style.display = 'none';
                el.success.classList.add('show');
                el.btn.classList.add('show');
            }, 500);
        }

        function voltarDiscord() {
            // Tenta abrir o app do Discord
            window.location.href = 'discord://-/';
            setTimeout(() => {
                window.close();
            }, 1500);
        }

        // Inicia
        window.addEventListener('load', iniciarVerificacao);
    </script>
</body>
</html>
